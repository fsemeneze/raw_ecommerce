version: 2

exposures:
  - name: ecommerce_dashboard
    label: E-commerce Olist — Análise de Vendas e Logística
    type: dashboard
    maturity: high
    url: https://datastudio.google.com/s/ixt0Zi2hjds
    description: >
      Dashboard de KPIs de e-commerce conectado ao BigQuery.
      2 páginas — Produtos (bi_order_items) e Pedidos (bi_orders) —
      com métricas de vendas, entregas, pagamentos e avaliações.

    depends_on:
      - ref('fct_orders')
      - ref('dim_customers')
      - ref('dim_products')
      - ref('dim_sellers')
      - ref('dim_geolocation')
      - ref('fct_payments')
      - ref('fct_reviews')
      - ref('bi_orders')
      - ref('bi_order_items')

    owner:
      name: Fabricio Menezes
      email: fmenezes722@gmail.com
